# ============================================================
# 连接精灵链 - 生产环境配置
# 启动方式: java -jar linksprite-backend.jar --spring.profiles.active=prod
# ============================================================

spring:
  # 生产环境启用数据源与 Redis（不排除自动装配）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 统一走环境变量，默认指向浏览器索引库 linkelf_explorer
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/linkelf_explorer?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 生产环境启用区块链连接
fisco:
  enabled: true
  # 部署接口默认关闭：首次部署或升级合约时临时开启，部署完成应立即关闭
  deploy-enabled: false
  crypto-type: SM
  peers:
    - 127.0.0.1:20200
    - 127.0.0.1:20201
    - 127.0.0.1:20202
    - 127.0.0.1:20203
  group-id: group0
  chain-id: "1000"
  cert-path: file:cert
  check-node-on-startup: true
  connect-timeout: 5000
  account:
    file-format: pem
    account-file: sdk.pem
    account-address: ""
    password: ""

# 合约地址（已部署，国密 SM3 selector）
contract:
  authorization-registry: "0x11470ee0df7e3b956b4a1a2f234c04fd80fa9bab"
  linksprite-nft: "0x7686bdb00e51689d3923d8ca4b38ec45ec3d03ab"
  transfer-policy: "0x7859d6aec0a0491959aaa054eeeb374495cb5700"
  kyc-registry: "0xb96b1ceb674d7b8fb09d2151d329f48d36f9ab42"
  sprite-compute-token: "0xf458ec8eb469ea73a07596f2a41834be5ca8868a"
  ai-account-factory: "0x2f6270af48b70784577eb18312d9468d457f6ea6"
  paymaster: "0x388baf0fddec40528e9c4824d748dfa6981862e9"

logging:
  level:
    com.linksprite: info
    org.fisco: info
