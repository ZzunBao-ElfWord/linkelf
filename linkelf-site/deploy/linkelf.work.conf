# LinkElf nginx site config
# 官网       https://linkelf.work/          -> /opt/linksprite/site
# 浏览器     https://linkelf.work/browser/  -> /opt/linksprite/web
# 旧子域     http://browser.linkelf.work/   -> 301 到 https://linkelf.work/browser/

server {
    listen 80;
    server_name linkelf.work;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://linkelf.work$request_uri;
    }
}

server {
    listen 80;
    server_name browser.linkelf.work;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://linkelf.work/browser/;
    }
}

# 旧子域 HTTPS：证书暂未覆盖子域，仅作跳转，避免落到其它默认站点
server {
    listen 443 ssl;
    server_name browser.linkelf.work;

    ssl_certificate /etc/letsencrypt/live/linkelf.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkelf.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://linkelf.work/browser/;
}

server {
    listen 443 ssl;
    server_name linkelf.work;

    client_max_body_size 1m;
    root /opt/linksprite/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/linkelf.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkelf.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 免费沙箱：暂时隐藏（恢复时注释掉下面两段 return 404，并启用沙箱服务）
    location = /sandbox {
        return 404;
    }

    location ^~ /sandbox/ {
        return 404;
    }

    # location ^~ /sandbox/api/ {
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 30s;
    # }

    # 区块链浏览器（原 browser.linkelf.work，当前走路径）
    location = /browser {
        return 301 /browser/;
    }

    location ^~ /browser/ {
        alias /opt/linksprite/web/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /api/explorer/ {
        limit_req zone=explorer burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
